name: Publish macOS release assets

on:
  workflow_run:
    workflows: [macOS adaptation]
    branches: [macos-adaptation]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS adaptation run ID (reuse existing build)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-macos-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.1-rc.1
    steps:
      # Do not check out or execute code from the triggering build.
      - name: Validate build provenance and artifacts
        id: build
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN: ${{ inputs.run_id }}
        with:
          script: |
            const runId = context.eventName === 'workflow_dispatch'
              ? process.env.REQUESTED_RUN : String(context.payload.workflow_run.id);
            if (!/^\d+$/.test(runId)) throw new Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.head_branch !== 'macos-adaptation' || run.path !== '.github/workflows/macos.yml' ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Only successful trusted macOS builds can be published');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: runId, per_page: 100});
            const names = ['Simple-macos-14-unsigned-preview', 'Simple-macos-15-intel-unsigned-preview'];
            // Push-triggered compile checks intentionally have no package artifacts.
            if (!artifacts.length && context.eventName === 'workflow_run') {
              core.setOutput('ready', 'false'); return;
            }
            for (const name of names) {
              if (artifacts.filter(a => a.name === name && !a.expired).length !== 1)
                throw new Error(`Missing or ambiguous artifact: ${name}`);
            }
            core.setOutput('ready', 'true');
            core.setOutput('run_id', runId);
            core.setOutput('sha', run.head_sha);
      - name: Download existing build artifacts on GitHub runner
        if: steps.build.outputs.ready == 'true'
        env:
          BUILD_RUN: ${{ steps.build.outputs.run_id }}
        run: |
          gh run download "$BUILD_RUN" --name Simple-macos-14-unsigned-preview --dir artifacts/arm64
          gh run download "$BUILD_RUN" --name Simple-macos-15-intel-unsigned-preview --dir artifacts/x64
      - name: Prepare architecture-specific downloads and checksums
        if: steps.build.outputs.ready == 'true'
        env:
          BUILD_RUN: ${{ steps.build.outputs.run_id }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil
          out = pathlib.Path('release-assets')
          out.mkdir()
          for arch in ('arm64', 'x64'):
              root = pathlib.Path('artifacts') / arch
              for suffix in ('.dmg', '.tar.gz'):
                  files = [p for p in root.rglob('*') if p.is_file() and p.name.endswith(suffix)]
                  if len(files) != 1 or files[0].is_symlink():
                      raise SystemExit(f'Expected one regular {arch} {suffix} bundle')
                  shutil.copyfile(files[0], out / f'Simple-macos-{arch}-unsigned{suffix}')
          checksums = ''.join(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n'
                              for p in sorted(out.iterdir()))
          (out / 'Simple-macos-SHA256SUMS.txt').write_text(checksums)
          (out / 'Simple-macos-build.txt').write_text(
              f'Build run: {os.environ["BUILD_RUN"]}\nSource commit: {os.environ["BUILD_SHA"]}\n'
              'Unsigned preview; not Apple notarized. macOS 14 or newer.\n'
              'arm64: Apple Silicon. x64: Intel.\n')
          PY
      - name: Upload to existing Release
        if: steps.build.outputs.ready == 'true'
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          echo "Mac downloads: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
